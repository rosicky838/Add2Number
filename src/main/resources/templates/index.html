<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Add2Num</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light py-5">
<div class="container" style="max-width:600px">

    <h2 class="text-center mb-4">🧮 Cộng 2 Số Lớn</h2>

    <!-- Form -->
    <div class="card p-4 mb-4">
        <form method="post" th:action="@{/calculate}">
            <div class="row g-2 align-items-end">
                <div class="col">
                    <label class="form-label">Số 1</label>
                    <input name="num1" class="form-control" th:value="${num1}" placeholder="1234" required/>
                </div>
                <div class="col-auto pb-2"><h4>+</h4></div>
                <div class="col">
                    <label class="form-label">Số 2</label>
                    <input name="num2" class="form-control" th:value="${num2}" placeholder="897" required/>
                </div>
            </div>
            <button class="btn btn-primary w-100 mt-3">Tính</button>
        </form>
    </div>

    <!-- Lỗi -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Kết quả -->
    <div th:if="${result}">
        <div class="alert alert-success text-center fs-5">
            <span th:text="${num1}"></span> + <span th:text="${num2}"></span>
            = <strong th:text="${result}"></strong>
        </div>

        <div class="card p-3">
            <h6>📋 Tiến trình:</h6>
            <ul class="list-group list-group-flush">
                <li class="list-group-item font-monospace small"
                    th:each="s : ${steps}" th:text="${s}">
                </li>
            </ul>
        </div>
    </div>

</div>
</body>
</html>
